<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anthropic Claude Practice Hub • Certification & Exam Prep</title>
  <meta name="description" content="Free, open-source scenario-based practice exam engine for Anthropic Claude certifications. Master Prompt Engineering, MCP, Tool Use, API architecture, and AI Safety." />
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#FDF8F6',
              100: '#F2E8E5',
              400: '#E78C73',
              500: '#E07A5F',
              600: '#CC6246',
              700: '#A94A32',
              900: '#5A2417',
            },
            darkbg: {
              950: '#090D16',
              900: '#0F172A',
              850: '#141E33',
              800: '#1E293B',
              700: '#334155',
            }
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    code, .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090D16; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-darkbg-950 text-slate-100 min-h-screen antialiased flex flex-col justify-between selection:bg-brand-500 selection:text-white" x-data="anthropicExamApp()" x-init="initApp()" x-cloak>

  <!-- Top Ribbon -->
  <div class="bg-gradient-to-r from-brand-900/40 via-brand-700/10 to-darkbg-950 border-b border-brand-900/20 px-4 py-2 text-xs text-brand-100 flex items-center justify-between">
    <div class="max-w-6xl mx-auto w-full flex items-center justify-between">
      <span class="flex items-center gap-2 font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        Anthropic Claude Certification Hub • All 5 Tracks • No Login Required
      </span>
      <div class="flex items-center gap-4 text-slate-400 text-[11px]">
        <button @click="view = 'landing'" x-show="view === 'practice'" class="hover:text-brand-300 transition flex items-center gap-1">
          ← Overview Home
        </button>
        <button @click="resetProgress()" class="hover:text-rose-400 underline decoration-dotted transition">Reset Progress</button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="border-b border-darkbg-800 bg-darkbg-900/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3 cursor-pointer" @click="view = 'landing'">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center font-extrabold text-white text-lg shadow-lg shadow-brand-500/20 border border-brand-500/30">
          A
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
            Anthropic Exam Practice
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-100 border border-brand-500/30 font-medium">5 Certifications</span>
          </h1>
          <p class="text-xs text-slate-400">Interactive Scenarios, Distractor Analysis & Timed Exam Engine</p>
        </div>
      </div>

      <!-- Header Controls -->
      <div class="flex items-center gap-3">
        <template x-if="view === 'landing'">
          <button @click="startPracticing('all')" class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-xs transition duration-150 shadow-lg shadow-brand-600/30 flex items-center gap-2">
            <span>Start Practicing</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>
        </template>
        <template x-if="view === 'practice'">
          <div class="flex items-center gap-2">
            <div class="bg-darkbg-950 border border-darkbg-800 p-1 rounded-xl flex text-xs font-medium shadow-inner">
              <button @click="setMode('study')" :class="mode === 'study' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg transition duration-150 flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                Study
              </button>
              <button @click="setMode('exam')" :class="mode === 'exam' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg transition duration-150 flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Exam
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </header>

  <!-- ==================== VIEW 1: LANDING PAGE ==================== -->
  <template x-if="view === 'landing'">
    <div class="flex-1">
      <!-- Hero Section -->
      <section class="max-w-6xl mx-auto px-4 pt-16 pb-12 text-center">
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-brand-500/10 border border-brand-500/20 text-brand-300 text-xs font-semibold mb-6">
          <span class="w-2 h-2 rounded-full bg-brand-400"></span>
          Realistic Scenario Practice • 100% Free & Open Source
        </div>
        <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight max-w-3xl mx-auto leading-tight sm:leading-tight mb-6">
          Master the <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 via-amber-300 to-brand-500">Anthropic Claude</span> Certifications
        </h1>
        <p class="text-base sm:text-lg text-slate-400 max-w-2xl mx-auto leading-relaxed mb-8">
          Realistic scenario-based practice questions covering Prompt Engineering, Model Context Protocol (MCP), Tool Use, Architecture, and Constitutional AI Safety.
        </p>

        <!-- CTA Action Buttons -->
        <div class="flex flex-wrap items-center justify-center gap-4 mb-14">
          <button @click="startPracticing('all')" class="px-8 py-4 rounded-2xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-sm sm:text-base shadow-xl shadow-brand-600/30 transition transform hover:-translate-y-0.5 flex items-center gap-3">
            <span>Start practicing — no account needed</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>
        </div>

        <!-- Metrics & Feature Bar -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-4xl mx-auto text-left">
          <div class="bg-darkbg-900 border border-darkbg-800 p-6 rounded-3xl">
            <div class="w-10 h-10 rounded-xl bg-brand-500/10 border border-brand-500/20 text-brand-400 flex items-center justify-center font-bold mb-4">
              5
            </div>
            <h3 class="text-sm font-bold text-white mb-1">5 Certification Tracks</h3>
            <p class="text-xs text-slate-400 leading-relaxed">From foundational prompt structuring to advanced MCP server design and red teaming.</p>
          </div>
          <div class="bg-darkbg-900 border border-darkbg-800 p-6 rounded-3xl">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold mb-4">
              ✓
            </div>
            <h3 class="text-sm font-bold text-white mb-1">Distractor Analysis</h3>
            <p class="text-xs text-slate-400 leading-relaxed">Don't just memorize answers. Understand exactly why each incorrect choice is wrong.</p>
          </div>
          <div class="bg-darkbg-900 border border-darkbg-800 p-6 rounded-3xl">
            <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center font-bold mb-4">
              ⏱
            </div>
            <h3 class="text-sm font-bold text-white mb-1">Dual Practice Modes</h3>
            <p class="text-xs text-slate-400 leading-relaxed">Study mode with instant feedback or timed exam mode simulating realistic test conditions.</p>
          </div>
        </div>
      </section>

      <!-- Certification Tracks Directory -->
      <section class="max-w-6xl mx-auto px-4 py-12 border-t border-darkbg-800/80">
        <div class="flex items-center justify-between mb-8">
          <div>
            <h2 class="text-xl font-bold text-white">Choose an Exam Track</h2>
            <p class="text-xs text-slate-400">Select a specific certification to start focused practice or test all tracks together.</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <template x-for="track in tracks" :key="track">
            <div class="bg-darkbg-900 border border-darkbg-800 hover:border-brand-500/50 rounded-3xl p-6 transition flex flex-col justify-between group">
              <div>
                <div class="flex items-center justify-between mb-3">
                  <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-brand-500/10 text-brand-300 border border-brand-500/20 uppercase" x-text="getTrackQuestionCount(track) + ' Questions'"></span>
                  <span class="text-xs text-slate-400">Claude 3.5</span>
                </div>
                <h3 class="text-base font-bold text-white group-hover:text-brand-300 transition mb-2" x-text="track"></h3>
                <p class="text-xs text-slate-400 leading-relaxed mb-6" x-text="getTrackDescription(track)"></p>
              </div>
              <button @click="startPracticing(track)" class="w-full py-2.5 px-4 rounded-xl bg-darkbg-800 hover:bg-brand-600 text-white font-semibold text-xs transition duration-150 flex items-center justify-center gap-2">
                <span>Practice Track</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              </button>
            </div>
          </template>
        </div>
      </section>
    </div>
  </template>

  <!-- ==================== VIEW 2: INNER PRACTICE APP ==================== -->
  <template x-if="view === 'practice'">
    <div class="flex-1">
      <!-- Certification Track Navigation Bar -->
      <div class="bg-darkbg-900/40 border-b border-darkbg-800/80 px-4 py-2.5 overflow-x-auto">
        <div class="max-w-6xl mx-auto flex items-center gap-2 text-xs whitespace-nowrap">
          <span class="text-slate-400 font-semibold uppercase text-[10px] mr-1">Filter:</span>
          <button @click="filterByTrack('all')" :class="selectedTrack === 'all' ? 'bg-brand-500/20 text-brand-100 border-brand-500/40 font-semibold' : 'bg-darkbg-900 text-slate-400 border-darkbg-800 hover:text-white'" class="px-3 py-1.5 rounded-lg border transition">
            All Tracks (<span x-text="rawQuestions.length"></span>)
          </button>
          <template x-for="track in tracks" :key="track">
            <button @click="filterByTrack(track)" :class="selectedTrack === track ? 'bg-brand-500/20 text-brand-100 border-brand-500/40 font-semibold' : 'bg-darkbg-900 text-slate-400 border-darkbg-800 hover:text-white'" class="px-3 py-1.5 rounded-lg border transition" x-text="track">
            </button>
          </template>
        </div>
      </div>

      <!-- Main Practice Layout -->
      <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left / Question Area (8 cols) -->
        <div class="lg:col-span-8 space-y-6">

          <!-- Exam Timer Banner -->
          <template x-if="mode === 'exam' && !examFinished">
            <div class="bg-brand-900/20 border border-brand-500/30 p-4 rounded-2xl flex items-center justify-between text-xs">
              <div class="flex items-center gap-2">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-brand-500"></span>
                </span>
                <span class="font-bold text-brand-100">Timed Exam Mode Active</span>
              </div>
              <div class="font-mono text-sm font-bold text-brand-400 bg-darkbg-950 px-3 py-1 rounded-lg border border-brand-500/30" x-text="formatTime(timeRemaining)"></div>
              <button @click="finishExam()" class="px-3.5 py-1.5 bg-brand-600 hover:bg-brand-500 text-white rounded-lg font-semibold transition">Submit Exam</button>
            </div>
          </template>

          <!-- Exam Completed Summary Card -->
          <template x-if="mode === 'exam' && examFinished">
            <div class="bg-darkbg-900 border border-darkbg-800 rounded-3xl p-8 text-center space-y-6 shadow-2xl">
              <div class="inline-flex p-4 rounded-2xl bg-brand-500/10 border border-brand-500/20 text-brand-400">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </div>
              <div>
                <h2 class="text-2xl font-bold text-white mb-1">Exam Finished</h2>
                <p class="text-sm text-slate-400">Performance summary for <span class="text-brand-300 font-semibold" x-text="selectedTrack === 'all' ? 'All Certification Tracks' : selectedTrack"></span>.</p>
              </div>
              <div class="grid grid-cols-3 gap-4 max-w-md mx-auto">
                <div class="bg-darkbg-950 p-4 rounded-xl border border-darkbg-800">
                  <div class="text-2xl font-bold text-brand-400" x-text="calculatePercentage() + '%'"></div>
                  <div class="text-[10px] text-slate-400 uppercase font-semibold mt-1">Score</div>
                </div>
                <div class="bg-darkbg-950 p-4 rounded-xl border border-darkbg-800">
                  <div class="text-2xl font-bold text-emerald-400" x-text="examScore + '/' + activeQuestions.length"></div>
                  <div class="text-[10px] text-slate-400 uppercase font-semibold mt-1">Correct</div>
                </div>
                <div class="bg-darkbg-950 p-4 rounded-xl border border-darkbg-800">
                  <div :class="calculatePercentage() >= 75 ? 'text-emerald-400' : 'text-rose-400'" class="text-2xl font-bold" x-text="calculatePercentage() >= 75 ? 'PASS' : 'FAIL'"></div>
                  <div class="text-[10px] text-slate-400 uppercase font-semibold mt-1">Status (75% cutoff)</div>
                </div>
              </div>
              <div class="flex justify-center gap-3 pt-2">
                <button @click="restartExam()" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-xl transition">Retake Exam</button>
                <button @click="setMode('study')" class="px-5 py-2.5 bg-darkbg-800 hover:bg-darkbg-700 text-slate-200 text-xs font-semibold rounded-xl border border-darkbg-700 transition">Review Answers in Study Mode</button>
              </div>
            </div>
          </template>

          <!-- Active Question Card -->
          <template x-if="!(mode === 'exam' && examFinished) && currentQuestion">
            <div class="bg-darkbg-900 border border-darkbg-800 rounded-3xl p-6 sm:p-8 shadow-xl relative transition-all">
              
              <!-- Tag Row -->
              <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="text-xs font-semibold px-3 py-1 rounded-full bg-brand-500/10 text-brand-300 border border-brand-500/20" x-text="currentQuestion.track"></span>
                  <span class="text-xs px-2.5 py-1 rounded-full bg-darkbg-800 text-slate-300 border border-darkbg-700" x-text="currentQuestion.domain"></span>
                  <span class="text-[10px] px-2 py-0.5 rounded bg-darkbg-950 text-slate-400 border border-darkbg-800" x-text="currentQuestion.difficulty"></span>
                </div>

                <!-- Bookmark Button -->
                <button @click="toggleBookmark(currentQuestion.id)" :class="isBookmarked(currentQuestion.id) ? 'text-brand-400 bg-brand-400/10 border-brand-400/30' : 'text-slate-500 hover:text-slate-300 bg-darkbg-800/60 border-darkbg-700'" class="p-2 rounded-xl border transition text-xs flex items-center gap-1.5">
                  <svg class="w-4 h-4" :fill="isBookmarked(currentQuestion.id) ? 'currentColor' : 'none'" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
                  <span x-text="isBookmarked(currentQuestion.id) ? 'Saved' : 'Bookmark'"></span>
                </button>
              </div>

              <!-- Scenario Box -->
              <div class="mb-6 bg-darkbg-950 border-l-4 border-brand-500 p-4 rounded-r-2xl">
                <div class="text-[10px] font-bold text-brand-400 uppercase tracking-widest mb-1 flex items-center gap-1">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                  Realistic Scenario
                </div>
                <p class="text-sm text-slate-300 leading-relaxed" x-text="currentQuestion.scenario"></p>
              </div>

              <!-- Question Prompt -->
              <h2 class="text-base sm:text-lg font-semibold text-white mb-6 leading-snug" x-text="currentQuestion.question"></h2>

              <!-- Options List -->
              <div class="space-y-3 mb-6">
                <template x-for="(opt, idx) in currentQuestion.options" :key="idx">
                  <button 
                    @click="selectOption(idx)"
                    :disabled="userAnswers[currentQuestion.id] !== undefined && mode === 'study'"
                    :class="{
                      'border-darkbg-800 bg-darkbg-950/60 hover:bg-darkbg-800/80 hover:border-darkbg-700 text-slate-200': userAnswers[currentQuestion.id] === undefined,
                      'border-emerald-500 bg-emerald-950/30 text-emerald-200 shadow-sm shadow-emerald-950': (userAnswers[currentQuestion.id] !== undefined && idx === currentQuestion.correctIndex && mode === 'study'),
                      'border-rose-500 bg-rose-950/30 text-rose-200': (userAnswers[currentQuestion.id] === idx && idx !== currentQuestion.correctIndex && mode === 'study'),
                      'border-brand-500 bg-brand-950/30 text-brand-200': (userAnswers[currentQuestion.id] === idx && mode === 'exam')
                    }"
                    class="w-full text-left p-4 rounded-2xl border transition duration-150 flex items-start gap-3.5 group">
                    <span :class="{
                      'bg-emerald-500 text-slate-950 font-bold': (userAnswers[currentQuestion.id] !== undefined && idx === currentQuestion.correctIndex && mode === 'study'),
                      'bg-rose-500 text-white font-bold': (userAnswers[currentQuestion.id] === idx && idx !== currentQuestion.correctIndex && mode === 'study'),
                      'bg-brand-500 text-white font-bold': (userAnswers[currentQuestion.id] === idx && mode === 'exam'),
                      'bg-darkbg-800 text-slate-300 group-hover:bg-darkbg-700': userAnswers[currentQuestion.id] === undefined
                    }" class="font-mono text-xs px-2.5 py-1 rounded-lg border border-darkbg-700 shrink-0 transition" x-text="String.fromCharCode(65 + idx)"></span>
                    <span class="text-sm leading-relaxed" x-text="opt"></span>
                  </button>
                </template>
              </div>

              <!-- Study Mode Explanation & Distractor Breakdown -->
              <template x-if="mode === 'study' && userAnswers[currentQuestion.id] !== undefined">
                <div class="mt-6 pt-6 border-t border-darkbg-800 space-y-4">
                  <!-- Result Banner -->
                  <div :class="userAnswers[currentQuestion.id] === currentQuestion.correctIndex ? 'bg-emerald-950/30 border-emerald-800/60 text-emerald-300' : 'bg-rose-950/30 border-rose-800/60 text-rose-300'" class="p-4 rounded-2xl border text-sm">
                    <div class="font-bold mb-1 flex items-center gap-2">
                      <span x-text="userAnswers[currentQuestion.id] === currentQuestion.correctIndex ? '✓ Correct Answer' : '✕ Incorrect'"></span>
                    </div>
                    <p class="text-slate-300 text-xs leading-relaxed" x-text="currentQuestion.explanation"></p>
                  </div>

                  <!-- Distractor Breakdown -->
                  <div class="bg-darkbg-950 p-5 rounded-2xl border border-darkbg-800/80">
                    <h4 class="text-[11px] font-bold text-brand-400 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      Option-by-Option Breakdown (Distractor Analysis)
                    </h4>
                    <div class="space-y-2.5 text-xs text-slate-400">
                      <template x-for="(dText, dIdx) in currentQuestion.distractorAnalysis" :key="dIdx">
                        <div class="p-2.5 rounded-xl bg-darkbg-900/60 border border-darkbg-800">
                          <strong class="text-slate-200" x-text="'Option ' + String.fromCharCode(65 + parseInt(dIdx)) + ': '"></strong>
                          <span x-text="dText"></span>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Navigation Footer -->
              <div class="mt-8 flex justify-between items-center pt-4 border-t border-darkbg-800 text-xs">
                <button @click="prevQuestion()" :disabled="currentIndex === 0" class="px-4 py-2.5 font-medium rounded-xl bg-darkbg-800 hover:bg-darkbg-700 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center gap-1">
                  ← Previous
                </button>
                <span class="text-slate-400 font-mono" x-text="(currentIndex + 1) + ' / ' + activeQuestions.length"></span>
                <button @click="nextQuestion()" :disabled="currentIndex >= activeQuestions.length - 1" class="px-5 py-2.5 font-semibold rounded-xl bg-brand-600 hover:bg-brand-500 text-white disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center gap-1">
                  Next →
                </button>
              </div>
            </div>
          </template>
        </div>

        <!-- Right Sidebar / Question Navigator (4 cols) -->

        "subdomain": "Automated Red Teaming",
        "difficulty": "Advanced",
        "scenario": "A security red team is evaluating Claude for chemical, biological, radiological, or nuclear (CBRN) risk and jailbreak resistance prior to enterprise deployment.",
        "question": "How should an automated red teaming harness evaluate model safety against adversarial probes?",
        "options": [
          "Use an adversarial LLM to systematically generate jailbreak perturbations, evaluate Claude's refusal rate, and measure benign capability retention without over-refusal.",
          "Send one thousand identical test queries with a fixed seed and check if the word 'sorry' appears.",
          "Disable all model guardrails during evaluation to simulate worst-case scenarios.",
          "Manually read logs once a year after production release."
        ],
        "correctIndex": 0,
        "explanation": "Robust red teaming involves automated adversarial LLM generation across diverse attack vectors (many-shot jailbreaks, persona adoption, ciphering) while evaluating both safety refusal thresholds and false positive rates (over-refusal of benign requests).",
        "distractorAnalysis": {
          "1": "Identical queries with static seed fail to test adversarial attack surfaces.",
          "2": "Safety evaluations test the production-configured model's guardrails, not unaligned raw checkpoints.",
          "3": "Annual manual log reviews fail to detect vulnerabilities prior to deployment."
        }
      }
    ];

    function anthropicExamApp() {
      return {
        view: 'landing',
        mode: 'study',
        selectedTrack: 'all',
        currentIndex: 0,
        rawQuestions: EMBEDDED_QUESTIONS,
        activeQuestions: [],
        tracks: [],
        userAnswers: {},
        bookmarks: [],
        timeRemaining: 1800,
        timerInterval: null,
        examFinished: false,
        examScore: 0,

        initApp() {
          this.tracks = [...new Set(this.rawQuestions.map(q => q.track))];
          this.filterByTrack('all');
          this.loadStorage();
        },

        startPracticing(track) {
          this.filterByTrack(track);
          this.view = 'practice';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        filterByTrack(track) {
          this.selectedTrack = track;
          if (track === 'all') {
            this.activeQuestions = this.rawQuestions;
          } else {
            this.activeQuestions = this.rawQuestions.filter(q => q.track === track);
          }
          this.currentIndex = 0;
        },

        getTrackQuestionCount(track) {
          return this.rawQuestions.filter(q => q.track === track).length;
        },

        getTrackDescription(track) {
          const descs = {
            'Claude Certified Prompt Engineer': 'Master XML delimiters, prompt formatting, assistant prefilling, and chain-of-thought.',
            'Claude Certified Application Developer': 'Messages API payloads, SSE event streaming, error handling, and token management.',
            'Claude Agent & Tool Use Specialist (MCP)': 'Model Context Protocol, JSON tool schemas, stdio transports, and multi-turn agent loops.',
            'Claude AI Solutions Architect': 'Prompt caching breakpoints, Message Batches API, multimodal vision, and cost optimization.',
            'Claude Safety, Governance & Red Teaming': 'Constitutional AI, prompt injection defenses, automated red teaming, and refusal tuning.'
          };
          return descs[track] || 'Comprehensive scenario-based test bank.';
        },

        get currentQuestion() {
          return this.activeQuestions[this.currentIndex] || null;
        },

        setMode(newMode) {
          this.mode = newMode;
          if (newMode === 'exam') {
            this.startExam();
          } else {
            clearInterval(this.timerInterval);
            this.examFinished = false;
          }
        },

        startExam() {
          this.userAnswers = {};
          this.examFinished = false;
          this.timeRemaining = this.activeQuestions.length * 90;
          this.currentIndex = 0;
          clearInterval(this.timerInterval);
          this.timerInterval = setInterval(() => {
            if (this.timeRemaining > 0) {
              this.timeRemaining--;
            } else {
              this.finishExam();
            }
          }, 1000);
        },

        finishExam() {
          clearInterval(this.timerInterval);
          this.examFinished = true;
          let correct = 0;
          this.activeQuestions.forEach(q => {
            if (this.userAnswers[q.id] === q.correctIndex) {
              correct++;
            }
          });
          this.examScore = correct;
        },

        restartExam() {
          this.startExam();
        },

        selectOption(idx) {
          if (this.currentQuestion) {
            this.userAnswers[this.currentQuestion.id] = idx;
            this.saveStorage();
          }
        },

        nextQuestion() {
          if (this.currentIndex < this.activeQuestions.length - 1) {
            this.currentIndex++;
          }
        },

        prevQuestion() {
          if (this.currentIndex > 0) {
            this.currentIndex--;
          }
        },

        jumpToQuestion(index) {
          this.currentIndex = index;
        },

        toggleBookmark(id) {
          if (this.bookmarks.includes(id)) {
            this.bookmarks = this.bookmarks.filter(b => b !== id);
          } else {
            this.bookmarks.push(id);
          }
          this.saveStorage();
        },

        isBookmarked(id) {
          return this.bookmarks.includes(id);
        },

        calculateProgress() {
          if (!this.activeQuestions.length) return 0;
          let answered = this.activeQuestions.filter(q => this.userAnswers[q.id] !== undefined).length;
          return Math.round((answered / this.activeQuestions.length) * 100);
        },

        calculateAccuracy() {
          let answered = this.activeQuestions.filter(q => this.userAnswers[q.id] !== undefined);
          if (!answered.length) return 0;
          let correct = answered.filter(q => this.userAnswers[q.id] === q.correctIndex).length;
          return Math.round((correct / answered.length) * 100);
        },

        calculatePercentage() {
          if (!this.activeQuestions.length) return 0;
          return Math.round((this.examScore / this.activeQuestions.length) * 100);
        },

        formatTime(seconds) {
          const m = Math.floor(seconds / 60);
          const s = seconds % 60;
          return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        },

        saveStorage() {
          try {
            localStorage.setItem('anthropic_exam_answers', JSON.stringify(this.userAnswers));
            localStorage.setItem('anthropic_exam_bookmarks', JSON.stringify(this.bookmarks));
          } catch (e) {}
        },

        loadStorage() {
          try {
            const savedAnswers = localStorage.getItem('anthropic_exam_answers');
            if (savedAnswers) this.userAnswers = JSON.parse(savedAnswers);
            const savedBookmarks = localStorage.getItem('anthropic_exam_bookmarks');
            if (savedBookmarks) this.bookmarks = JSON.parse(savedBookmarks);
          } catch (e) {}
        },

        resetProgress() {
          if (confirm('Are you sure you want to reset all answers and bookmarks?')) {
            this.userAnswers = {};
            this.bookmarks = [];
            localStorage.removeItem('anthropic_exam_answers');
            localStorage.removeItem('anthropic_exam_bookmarks');
            this.currentIndex = 0;
          }
        }
      }
    }
  </script>

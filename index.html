<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anthropic Claude Practice • Scenario Training for AI Practitioners</title>
  <meta name="description" content="Scenario training for Anthropic Claude practitioners. Realistic scenarios covering Prompt Engineering, MCP, Tool Use, Architecture, and AI Safety." />
  <!-- Google Fonts: Source Serif 4, Inter, & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Source Serif 4"', 'Georgia', 'Cambria', 'serif'],
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            paper: {
              50: '#FAF9F6',
              100: '#F7F6F2',
              200: '#EFECE6',
              300: '#E5E2DA',
              400: '#D5D0C5',
            },
            ink: {
              900: '#111827',
              800: '#1F2937',
              700: '#374151',
              600: '#4B5563',
              500: '#6B7280',
              400: '#9CA3AF',
            }
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    body { 
      background-color: #F7F6F2; 
      color: #111827; 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
    }
    h1, h2, h3, h4, .font-serif { 
      font-family: 'Source Serif 4', Georgia, Cambria, serif; 
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen antialiased flex flex-col justify-between" x-data="anthropicExamApp()" x-init="initApp()" x-cloak>

  <!-- ==================== MAIN APPLICATION CONTAINER ==================== -->
  <div class="flex-1 flex flex-col md:flex-row min-h-screen">
    
    <!-- LEFT SIDEBAR (EXACT MATCH TO REFERENCE SCREENSHOT) -->
    <aside class="w-full md:w-64 bg-[#F7F6F2] border-b md:border-b-0 md:border-r border-[#E5E2DA] p-6 flex flex-col justify-between shrink-0">
      <div class="space-y-6">
        
        <!-- Brand Header -->
        <div class="space-y-1">
          <div class="font-serif text-xl font-semibold text-ink-900 leading-tight cursor-pointer" @click="navigate('home')">
            Anthropic Claude<br>Practice
          </div>
          <div class="text-xs text-ink-500 pt-3" x-text="getGreeting()"></div>
        </div>

        <!-- Navigation Menu -->
        <nav class="space-y-1.5 pt-2">
          
          <!-- Home Nav Item -->
          <button @click="navigate('home')" :class="currentTab === 'home' ? 'bg-[#ECE8DF] text-ink-900 font-semibold' : 'text-ink-700 hover:bg-[#EFECE6]'" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition duration-150 text-left">
            <span :class="currentTab === 'home' ? 'bg-ink-900 text-white' : 'bg-transparent text-ink-700'" class="w-6 h-6 rounded-lg flex items-center justify-center text-xs">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            </span>
            <span>Home</span>
          </button>

          <!-- Practice Nav Item -->
          <button @click="navigate('practice')" :class="currentTab === 'practice' ? 'bg-[#ECE8DF] text-ink-900 font-semibold' : 'text-ink-700 hover:bg-[#EFECE6]'" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition duration-150 text-left">
            <span :class="currentTab === 'practice' ? 'bg-ink-900 text-white' : 'bg-transparent text-ink-700'" class="w-6 h-6 rounded-lg flex items-center justify-center text-xs">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            </span>
            <span>Practice</span>
          </button>

          <!-- Review Nav Item with Badge -->
          <button @click="navigate('review')" :class="currentTab === 'review' ? 'bg-[#ECE8DF] text-ink-900 font-semibold' : 'text-ink-700 hover:bg-[#EFECE6]'" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition duration-150 text-left">
            <div class="flex items-center gap-3">
              <span :class="currentTab === 'review' ? 'bg-ink-900 text-white' : 'bg-transparent text-ink-700'" class="w-6 h-6 rounded-lg flex items-center justify-center text-xs">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </span>
              <span>Review</span>
            </div>
            <template x-if="getReviewCount() > 0">
              <span class="px-2 py-0.5 rounded-full text-[10px] bg-rose-100 text-rose-900 font-bold font-mono" x-text="getReviewCount()"></span>
            </template>
          </button>

          <!-- Exam Nav Item -->
          <button @click="navigate('exam')" :class="currentTab === 'exam' ? 'bg-[#ECE8DF] text-ink-900 font-semibold' : 'text-ink-700 hover:bg-[#EFECE6]'" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition duration-150 text-left">
            <span :class="currentTab === 'exam' ? 'bg-ink-900 text-white' : 'bg-transparent text-ink-700'" class="w-6 h-6 rounded-lg flex items-center justify-center text-xs">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </span>
            <span>Exam</span>
          </button>

          <!-- Progress Nav Item -->
          <button @click="navigate('progress')" :class="currentTab === 'progress' ? 'bg-[#ECE8DF] text-ink-900 font-semibold' : 'text-ink-700 hover:bg-[#EFECE6]'" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition duration-150 text-left">
            <span :class="currentTab === 'progress' ? 'bg-ink-900 text-white' : 'bg-transparent text-ink-700'" class="w-6 h-6 rounded-lg flex items-center justify-center text-xs">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            </span>
            <span>Progress</span>
          </button>

          <!-- Settings Nav Item -->
          <button @click="navigate('settings')" :class="currentTab === 'settings' ? 'bg-[#ECE8DF] text-ink-900 font-semibold' : 'text-ink-700 hover:bg-[#EFECE6]'" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition duration-150 text-left">
            <span :class="currentTab === 'settings' ? 'bg-ink-900 text-white' : 'bg-transparent text-ink-700'" class="w-6 h-6 rounded-lg flex items-center justify-center text-xs">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </span>
            <span>Settings</span>
          </button>

        </nav>
      </div>

      <!-- Bottom Disclaimer -->
      <div class="text-[11px] text-ink-500 pt-6 border-t border-[#E5E2DA] leading-relaxed">
        Independent educational product. Not affiliated with any certification body.
      </div>
    </aside>

    <!-- RIGHT MAIN CONTENT AREA -->
    <div class="flex-1 p-4 sm:p-8 lg:p-10 max-w-6xl mx-auto w-full">
      
      <!-- ==================== TAB 1: HOME (DASHBOARD WITH TOOLKIT & SESSION STATS) ==================== -->
      <template x-if="currentTab === 'home'">
        <div class="space-y-8">
          
          <!-- Top Grid: Main Focus Card (Left) + Side Widgets (Right) -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- Left Focus Card (8 cols) -->
            <div class="lg:col-span-8 bg-white border border-[#E5E2DA] rounded-3xl p-6 sm:p-8 shadow-sm space-y-6 flex flex-col justify-between">
              <div>
                <span class="text-[11px] font-bold text-blue-700 tracking-wider uppercase font-sans">CURRENT FOCUS</span>
                <h1 class="text-2xl sm:text-3xl font-serif text-ink-900 mt-1 mb-2" x-text="getFocusTitle()"></h1>
                <p class="text-sm text-ink-700 leading-relaxed max-w-lg mb-3" x-text="getFocusDescription()"></p>
                <div class="text-xs text-ink-500 font-medium mb-6">
                  <span x-text="selectedTrack === 'all' ? 'All 5 Tracks Preparation' : selectedTrack"></span> · About 12 minutes
                </div>

                <!-- Milestone Pipeline Gate Graphic -->
                <div class="bg-[#F7F6F2] border border-[#E5E2DA] rounded-2xl p-5 mb-6 text-center">
                  <span class="text-xs font-serif text-ink-800 font-semibold block mb-4">Architecture & Gate Flow</span>
                  <div class="flex items-center justify-between max-w-md mx-auto text-[11px] font-medium text-ink-600 relative">
                    <div class="absolute top-2.5 left-6 right-6 h-0.5 bg-[#E5E2DA] z-0"></div>
                    
                    <div class="relative z-10 flex flex-col items-center gap-1.5">
                      <span class="w-5 h-5 rounded-full bg-white border-2 border-ink-400 flex items-center justify-center text-[9px] font-mono">1</span>
                      <span>Delimiters</span>
                    </div>
                    <div class="relative z-10 flex flex-col items-center gap-1.5">
                      <span class="w-5 h-5 rounded-full bg-white border-2 border-ink-400 flex items-center justify-center text-[9px] font-mono">2</span>
                      <span>MCP Schema</span>
                    </div>
                    <div class="relative z-10 flex flex-col items-center gap-1.5">
                      <span class="w-5 h-5 rounded-full bg-white border-2 border-ink-400 flex items-center justify-center text-[9px] font-mono">3</span>
                      <span>Caching</span>
                    </div>
                    <div class="relative z-10 flex flex-col items-center gap-1.5">
                      <span class="w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center text-[9px] font-mono font-bold">4</span>
                      <span class="text-blue-900 font-semibold">Safety Gate</span>
                    </div>
                  </div>
                </div>

                <!-- CTA Button -->
                <div class="flex flex-wrap items-center gap-4">
                  <button @click="navigate('practice')" class="px-6 py-3 rounded-xl bg-ink-900 hover:bg-ink-800 text-white font-medium text-xs sm:text-sm transition duration-150 shadow-sm">
                    Continue practicing
                  </button>
                  <button @click="openTrackSelector = true" class="text-xs font-medium text-ink-700 hover:text-ink-900 underline transition">
                    Choose another focus
                  </button>
                </div>
              </div>
            </div>

            <!-- Right Column Widgets (4 cols) -->
            <div class="lg:col-span-4 space-y-6">
              
              <!-- "Why this matters" Card -->
              <div class="bg-[#FAF5EE] border border-[#EADBCE] rounded-3xl p-6 space-y-2">
                <div class="flex items-center gap-2 text-amber-900 text-xs font-bold font-serif">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  Why this matters
                </div>
                <p class="text-xs text-ink-800 leading-relaxed">
                  Robust Claude integration starts before production release. Explicit XML delimiters, least-privilege MCP scopes, and prompt caching are what make agent workflows fast, deterministic, and safe.
                </p>
              </div>

              <!-- Session Focus Stats Card -->
              <div class="bg-white border border-[#E5E2DA] rounded-3xl p-6 space-y-4 shadow-sm">
                <h3 class="text-base font-serif font-semibold text-ink-900">Session focus</h3>
                
                <!-- Daily Goal -->
                <div class="space-y-2">
                  <div class="flex items-center justify-between text-xs text-ink-600">
                    <span>Today's goal</span>
                    <span class="font-mono font-bold text-ink-900" x-text="todayAnswered + ' of 10'"></span>
                  </div>
                  <!-- 10 dots -->
                  <div class="grid grid-cols-10 gap-1.5">
                    <template x-for="i in 10" :key="i">
                      <div class="h-2 rounded-full transition-all" :class="i <= todayAnswered ? 'bg-ink-900' : 'bg-[#EFECE6]'"></div>
                    </template>
                  </div>
                </div>

                <!-- Bank Covered -->
                <div class="space-y-1.5 pt-2 border-t border-[#E5E2DA]">
                  <div class="flex items-center justify-between text-xs text-ink-600">
                    <span>Bank covered</span>
                    <span class="font-mono font-bold text-ink-900" x-text="answeredCount + ' of ' + rawQuestions.length"></span>
                  </div>
                  <div class="w-full bg-[#EFECE6] h-2 rounded-full overflow-hidden">
                    <div class="bg-ink-900 h-full transition-all" :style="'width: ' + Math.round((answeredCount / rawQuestions.length) * 100) + '%'"></div>
                  </div>
                </div>

                <!-- Consecutive Days -->
                <div class="flex items-center justify-between text-xs text-ink-600 pt-2 border-t border-[#E5E2DA]">
                  <span>Consecutive days</span>
                  <span class="font-mono font-bold text-ink-900">1 day</span>
                </div>
              </div>

            </div>

          </div>

          <!-- Anthropic Toolkit Visual Cards Section -->
          <div class="space-y-4 pt-2">
            <h2 class="text-xl font-serif font-semibold text-ink-900">Anthropic architecture toolkit</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              
              <!-- Card 1: Levels of human oversight / autonomy -->
              <div class="bg-white border border-[#E5E2DA] rounded-3xl p-6 sm:p-7 shadow-sm space-y-4 flex flex-col justify-between">
                <div>
                  <div class="flex items-center gap-2 mb-2">
                    <span class="w-7 h-7 rounded-lg bg-ink-900 text-white flex items-center justify-center text-xs">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
                    </span>
                    <h3 class="font-serif text-base font-semibold text-ink-900">Levels of human oversight</h3>
                  </div>
                  <p class="text-xs text-ink-600 leading-relaxed">
                    Three postures in descending order of human involvement. Choosing one is a judgement about how reversible a wrong outcome is — not about how confident the model sounds.
                  </p>
                </div>

                <div class="pt-4 flex items-end justify-between gap-3 text-center text-[10px] font-medium text-ink-700">
                  <div class="flex-1 space-y-1">
                    <div class="h-8 bg-[#D4DFD7] rounded-lg"></div>
                    <span>Assist</span>
                  </div>
                  <div class="flex-1 space-y-1">
                    <div class="h-12 bg-[#B7CBBF] rounded-lg"></div>
                    <span>Review</span>
                  </div>
                  <div class="flex-1 space-y-1">
                    <div class="h-16 bg-[#8FAEA0] rounded-lg"></div>
                    <span class="font-bold text-ink-900">Intervene</span>
                  </div>
                </div>
              </div>

              <!-- Card 2: MCP Topology & Responsibility Map -->
              <div class="bg-white border border-[#E5E2DA] rounded-3xl p-6 sm:p-7 shadow-sm space-y-4 flex flex-col justify-between">
                <div>
                  <div class="flex items-center gap-2 mb-2">
                    <span class="w-7 h-7 rounded-lg bg-ink-900 text-white flex items-center justify-center text-xs">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </span>
                    <h3 class="font-serif text-base font-semibold text-ink-900">Model Context Protocol topology</h3>
                  </div>
                  <p class="text-xs text-ink-600 leading-relaxed">
                    How MCP clients connect Claude to isolated servers exposing Resources, Prompts, and Tools with standard security boundaries.
                  </p>
                </div>

                <div class="pt-4 flex items-center justify-center gap-2 text-center text-[10px] font-medium">
                  <span class="px-2.5 py-1 rounded bg-[#EFECE6] border border-[#E5E2DA] text-ink-800">Host (Client)</span>
                  <span class="text-ink-400">↔</span>
                  <span class="px-2.5 py-1 rounded bg-blue-100 border border-blue-300 text-blue-900 font-bold">Claude (LLM)</span>
                  <span class="text-ink-400">↔</span>
                  <span class="px-2.5 py-1 rounded bg-[#EFECE6] border border-[#E5E2DA] text-ink-800">MCP Server</span>
                </div>
              </div>

            </div>
          </div>

        </div>
      </template>

      <!-- ==================== TAB 2: PRACTICE (/practice/) ==================== -->
      <template x-if="currentTab === 'practice'">
        <div class="space-y-6 max-w-3xl">
          
          <div class="flex flex-wrap items-center justify-between gap-4 bg-white border border-[#E5E2DA] p-4 rounded-2xl shadow-sm text-xs">
            <div class="flex items-center gap-2">
              <span class="font-semibold text-ink-600 uppercase text-[11px]">Track:</span>
              <select x-model="selectedTrack" @change="filterByTrack(selectedTrack)" class="bg-[#F7F6F2] border border-[#E5E2DA] rounded-lg px-2.5 py-1.5 text-xs text-ink-900 font-medium focus:outline-none">
                <option value="all">All Tracks (<span x-text="rawQuestions.length"></span>)</option>
                <template x-for="track in tracks" :key="track">
                  <option :value="track" x-text="track"></option>
                </template>
              </select>
            </div>

            <div class="flex items-center gap-4 text-ink-600 font-mono text-xs">
              <span>Question <strong class="text-ink-900" x-text="currentIndex + 1"></strong> of <span x-text="activeQuestions.length"></span></span>
              <span>Score: <strong class="text-emerald-700" x-text="score + '/' + answeredCount"></strong></span>
            </div>
          </div>

          <template x-if="currentQuestion">
            <div class="bg-white border border-[#E5E2DA] rounded-3xl p-6 sm:p-8 shadow-sm space-y-6">
              
              <div class="flex items-center justify-between text-xs text-ink-500 pb-2 border-b border-[#E5E2DA]">
                <div class="flex items-center gap-2">
                  <span class="font-serif font-semibold text-ink-800" x-text="currentQuestion.track"></span>
                  <span>•</span>
                  <span x-text="currentQuestion.domain"></span>
                </div>
                <button @click="toggleBookmark(currentQuestion.id)" class="hover:text-ink-900 transition flex items-center gap-1 text-xs">
                  <span x-text="isBookmarked(currentQuestion.id) ? '★ Bookmarked' : '☆ Bookmark'"></span>
                </button>
              </div>

              <div class="text-base font-serif text-ink-900 leading-relaxed" x-text="currentQuestion.scenario"></div>

              <div class="text-sm font-medium text-ink-900" x-text="currentQuestion.question"></div>

              <div class="space-y-3">
                <template x-for="(opt, idx) in currentQuestion.options" :key="idx">
                  <button 
                    @click="selectOption(idx)"
                    :class="{
                      'border-[#E5E2DA] hover:border-ink-400 bg-white text-ink-900': userAnswers[currentQuestion.id] === undefined,
                      'border-emerald-600 bg-emerald-50 text-emerald-950 font-medium': (userAnswers[currentQuestion.id] !== undefined && idx === currentQuestion.correctIndex),
                      'border-rose-300 bg-rose-50 text-rose-950': (userAnswers[currentQuestion.id] === idx && idx !== currentQuestion.correctIndex)
                    }"
                    class="w-full text-left p-4 rounded-xl border transition text-sm flex items-start gap-3.5">
                    <span class="font-mono text-xs text-ink-500 font-bold mt-0.5" x-text="String.fromCharCode(65 + idx) + '.'"></span>
                    <span class="leading-relaxed" x-text="opt"></span>
                  </button>
                </template>
              </div>

              <template x-if="userAnswers[currentQuestion.id] !== undefined">
                <div class="pt-6 border-t border-[#E5E2DA] space-y-4">
                  <div :class="userAnswers[currentQuestion.id] === currentQuestion.correctIndex ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-900'" class="p-4 rounded-xl border text-xs sm:text-sm leading-relaxed">
                    <strong class="block mb-1 font-semibold" x-text="userAnswers[currentQuestion.id] === currentQuestion.correctIndex ? '✓ Correct Answer' : '✕ Incorrect'"></strong>
                    <span x-text="currentQuestion.explanation"></span>
                  </div>

                  <div class="bg-[#F7F6F2] p-4 rounded-xl border border-[#E5E2DA] text-xs space-y-2">
                    <span class="font-bold text-ink-600 uppercase text-[10px] tracking-wider block mb-1">Option Analysis</span>
                    <template x-for="(dText, dIdx) in currentQuestion.distractorAnalysis" :key="dIdx">
                      <div class="text-ink-700">

    function anthropicExamApp() {
      return {
        currentTab: 'home',
        selectedTrack: 'all',
        reviewFilter: 'all',
        openTrackSelector: false,
        currentIndex: 0,
        rawQuestions: EMBEDDED_QUESTIONS,
        activeQuestions: [],
        tracks: [],
        userAnswers: {},
        bookmarks: [],
        score: 0,
        answeredCount: 0,
        todayAnswered: 0,
        examInProgress: false,
        examFinished: false,
        timeRemaining: 1800,
        timerInterval: null,
        examScore: 0,

        initApp() {
          this.tracks = [...new Set(this.rawQuestions.map(q => q.track))];
          this.filterByTrack('all');
          this.loadStorage();

          const hash = window.location.hash.replace('#/', '').replace('#', '');
          if (['home', 'practice', 'review', 'exam', 'progress', 'settings'].includes(hash)) {
            this.currentTab = hash;
          }
          window.addEventListener('hashchange', () => {
            const h = window.location.hash.replace('#/', '').replace('#', '');
            if (['home', 'practice', 'review', 'exam', 'progress', 'settings'].includes(h)) {
              this.currentTab = h;
            }
          });
        },

        navigate(tab) {
          this.currentTab = tab;
          window.location.hash = '#/' + tab;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        startPracticing(track) {
          this.filterByTrack(track);
          this.navigate('practice');
        },

        filterByTrack(track) {
          this.selectedTrack = track;
          if (track === 'all') {
            this.activeQuestions = this.rawQuestions;
          } else {
            this.activeQuestions = this.rawQuestions.filter(q => q.track === track);
          }
          this.currentIndex = 0;
          this.updateStats();
        },

        getGreeting() {
          const hour = new Date().getHours();
          if (hour < 12) return 'Good morning';
          if (hour < 18) return 'Good afternoon';
          return 'Good evening';
        },

        getFocusTitle() {
          if (this.selectedTrack === 'Claude Certified Prompt Engineer') return 'Prompt structure & XML delimiters';
          if (this.selectedTrack === 'Claude Certified Application Developer') return 'Messages API & stream events';
          if (this.selectedTrack === 'Claude Agent & Tool Use Specialist (MCP)') return 'MCP server architecture & tools';
          if (this.selectedTrack === 'Claude AI Solutions Architect') return 'Prompt caching & batch scaling';
          if (this.selectedTrack === 'Claude Safety, Governance & Red Teaming') return 'Constitutional AI & red teaming';
          return 'Pre-launch architecture & controls';
        },

        getFocusDescription() {
          return 'Turn enterprise AI requirements into defensible prompt structures, tool schemas, and production deployment decisions.';
        },

        getTrackQuestionCount(track) {
          return this.rawQuestions.filter(q => q.track === track).length;
        },

        getTrackDescription(track) {
          const descs = {
            'Claude Certified Prompt Engineer': 'XML delimiters, prompt formatting, assistant prefilling, and chain-of-thought.',
            'Claude Certified Application Developer': 'Messages API payloads, SSE event streaming, and error retry strategies.',
            'Claude Agent & Tool Use Specialist (MCP)': 'Model Context Protocol, JSON tool schemas, and agent loops.',
            'Claude AI Solutions Architect': 'Prompt caching breakpoints, Batch API, and vision processing.',
            'Claude Safety, Governance & Red Teaming': 'Constitutional AI, prompt injection defense, and red teaming.'
          };
          return descs[track] || 'Scenario-based certification practice questions.';
        },

        get currentQuestion() {
          return this.activeQuestions[this.currentIndex] || null;
        },

        selectOption(idx) {
          if (this.currentQuestion) {
            this.userAnswers[this.currentQuestion.id] = idx;
            this.saveStorage();
            this.updateStats();
          }
        },

        updateStats() {
          let answered = this.activeQuestions.filter(q => this.userAnswers[q.id] !== undefined);
          this.answeredCount = answered.length;
          this.score = answered.filter(q => this.userAnswers[q.id] === q.correctIndex).length;
          this.todayAnswered = Math.min(10, this.answeredCount);
        },

        nextQuestion() {
          if (this.currentIndex < this.activeQuestions.length - 1) {
            this.currentIndex++;
          }
        },

        prevQuestion() {
          if (this.currentIndex > 0) {
            this.currentIndex--;
          }
        },

        jumpToQuestion(index) {
          this.currentIndex = index;
        },

        toggleBookmark(id) {
          if (this.bookmarks.includes(id)) {
            this.bookmarks = this.bookmarks.filter(b => b !== id);
          } else {
            this.bookmarks.push(id);
          }
          this.saveStorage();
        },

        isBookmarked(id) {
          return this.bookmarks.includes(id);
        },

        getReviewQuestions() {
          return this.rawQuestions.filter(q => {
            const isMissed = this.userAnswers[q.id] !== undefined && this.userAnswers[q.id] !== q.correctIndex;
            const isSaved = this.bookmarks.includes(q.id);
            if (this.reviewFilter === 'missed') return isMissed;
            if (this.reviewFilter === 'bookmarks') return isSaved;
            return isMissed || isSaved;
          });
        },

        getReviewCount() {
          return this.rawQuestions.filter(q => {
            const isMissed = this.userAnswers[q.id] !== undefined && this.userAnswers[q.id] !== q.correctIndex;
            const isSaved = this.bookmarks.includes(q.id);
            return isMissed || isSaved;
          }).length;
        },

        getMissedCount() {
          return this.rawQuestions.filter(q => this.userAnswers[q.id] !== undefined && this.userAnswers[q.id] !== q.correctIndex).length;
        },

        startExam() {
          this.examInProgress = true;
          this.examFinished = false;
          this.timeRemaining = this.activeQuestions.length * 90;
          this.currentIndex = 0;
          clearInterval(this.timerInterval);
          this.timerInterval = setInterval(() => {
            if (this.timeRemaining > 0) {
              this.timeRemaining--;
            } else {
              this.finishExam();
            }
          }, 1000);
        },

        finishExam() {
          clearInterval(this.timerInterval);
          this.examInProgress = false;
          this.examFinished = true;
          let correct = 0;
          this.activeQuestions.forEach(q => {
            if (this.userAnswers[q.id] === q.correctIndex) {
              correct++;
            }
          });
          this.examScore = correct;
        },

        restartExam() {
          this.startExam();
        },

        calculatePercentage() {
          if (!this.activeQuestions.length) return 0;
          return Math.round((this.examScore / this.activeQuestions.length) * 100);
        },

        calculateAccuracy() {
          let answered = this.rawQuestions.filter(q => this.userAnswers[q.id] !== undefined);
          if (!answered.length) return 0;
          let correct = answered.filter(q => this.userAnswers[q.id] === q.correctIndex).length;
          return Math.round((correct / answered.length) * 100);
        },

        getTrackScore(track) {
          const trackQs = this.rawQuestions.filter(q => q.track === track);
          const answered = trackQs.filter(q => this.userAnswers[q.id] !== undefined);
          const correct = answered.filter(q => this.userAnswers[q.id] === q.correctIndex);
          return correct.length + ' / ' + trackQs.length;
        },

        getTrackPercentage(track) {
          const trackQs = this.rawQuestions.filter(q => q.track === track);
          const answered = trackQs.filter(q => this.userAnswers[q.id] !== undefined);
          const correct = answered.filter(q => this.userAnswers[q.id] === q.correctIndex);
          if (!trackQs.length) return 0;
          return Math.round((correct.length / trackQs.length) * 100);
        },

        formatTime(seconds) {
          const m = Math.floor(seconds / 60);
          const s = seconds % 60;
          return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        },

        exportData() {
          const data = {
            userAnswers: this.userAnswers,
            bookmarks: this.bookmarks,
            timestamp: new Date().toISOString()
          };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'anthropic_exam_progress_backup.json';
          a.click();
        },

        saveStorage() {
          try {
            localStorage.setItem('anthropic_exam_answers', JSON.stringify(this.userAnswers));
            localStorage.setItem('anthropic_exam_bookmarks', JSON.stringify(this.bookmarks));
          } catch (e) {}
        },

        loadStorage() {
          try {
            const savedAnswers = localStorage.getItem('anthropic_exam_answers');
            if (savedAnswers) this.userAnswers = JSON.parse(savedAnswers);
            const savedBookmarks = localStorage.getItem('anthropic_exam_bookmarks');
            if (savedBookmarks) this.bookmarks = JSON.parse(savedBookmarks);
            this.updateStats();
          } catch (e) {}
        },

        resetProgress() {
          if (confirm('Are you sure you want to reset all answers and bookmarks?')) {
            this.userAnswers = {};
            this.bookmarks = [];
            localStorage.removeItem('anthropic_exam_answers');
            localStorage.removeItem('anthropic_exam_bookmarks');
            this.currentIndex = 0;
            this.updateStats();
          }
        }
      }
    }
  </script>
